spring:
  application:
    name: skyluma-backend

skyluma:
  cors:
    allowed-origins:
      - http://localhost:4200
  weather:
    provider: openmeteo

openweather:
  base-url: https://api.openweathermap.org/data/3.0
  connect-timeout: 3s
  read-timeout: 10s
  api-key: ${OPENWEATHER_API_KEY:}
  units: metric
  language: en

openmeteo:
  base-url: https://api.open-meteo.com
  connect-timeout: 3s
  read-timeout: 10s
